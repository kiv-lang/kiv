name: CI

on:
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Install LLVM
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-18 clang-18
        echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    
    - name: Run tests
      run: cargo test --workspace
    
    - name: Build
      run: cargo build --workspace --release

  build-cross-platform:
    name: Build Cross-Platform
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kiv-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kiv-windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kiv-macos-x64
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Install LLVM (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-18 clang-18
        echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
        
    - name: Install LLVM (Windows)
      if: runner.os == 'Windows'
      run: |
        # Download LLVM 18.1.8 development kit
        Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz" -OutFile "llvm.tar.xz"
        
        # Extract using 7-Zip
        7z x llvm.tar.xz
        7z x clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar
        
        # Move to C:\LLVM
        Move-Item "clang+llvm-18.1.8-x86_64-pc-windows-msvc" "C:\LLVM"
        
        # Set environment variables
        echo "LLVM_SYS_181_PREFIX=C:\LLVM" >> $env:GITHUB_ENV
        echo "C:\LLVM\bin" >> $env:GITHUB_PATH
        
        # Verify installation
        C:\LLVM\bin\llvm-config.exe --version
        C:\LLVM\bin\clang.exe --version
        
    - name: Install libxml2 (Windows)
      if: runner.os == 'Windows'
      run: |
        # Download libxml2 pre-compiled binaries
        Invoke-WebRequest -Uri "https://master.dl.sourceforge.net/project/gnuwin32/libxml/2.4.12-1/libxml2-2.4.12-1-lib.zip" -OutFile "libxml2.zip"
        
        # Extract using PowerShell's built-in Expand-Archive
        Expand-Archive -Path "libxml2.zip" -DestinationPath "libxml2-extracted"
        
        # Copy libxml2.lib directly to LLVM lib directory
        Copy-Item "libxml2-extracted\lib\libxml2.lib" "C:\LLVM\lib\libxml2.lib" -Force
        Write-Host "Copied libxml2.lib to C:\LLVM\lib\"
    
    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm@18
        # Support both Apple Silicon and Intel Macs
        if [[ -d "/opt/homebrew/opt/llvm@18/bin" ]]; then
          echo "/opt/homebrew/opt/llvm@18/bin" >> $GITHUB_PATH
        else
          echo "/usr/local/opt/llvm@18/bin" >> $GITHUB_PATH
        fi
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build release
      run: cargo build --release --target ${{ matrix.target }} --bin kiv
    
    - name: Prepare artifact
      shell: bash
      run: |
        mkdir -p dist
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          cp target/${{ matrix.target }}/release/kiv.exe dist/
        else
          cp target/${{ matrix.target }}/release/kiv dist/
        fi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: dist/
        retention-days: 30
